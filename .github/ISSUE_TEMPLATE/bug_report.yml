name: Bug report
description: Something behaves differently from how it is documented or intended.
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please do not use this form for security
        vulnerabilities — see the security reporting link on this page.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect to happen instead?
      placeholder: Running a capability through the process runtime returns an empty result, but the same capability returns output under the remote runtime.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release tag or commit SHA you are running.
      placeholder: v0.3.1, or 4f2a1c9
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Neuron is involved?
      options:
        - Neuron Assembly Protocol
        - N.O.R.E. (runtime)
        - TypeScript SDK
        - Go SDK
        - Python SDK
        - Rust SDK
        - Capability runtime
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: sdk
    attributes:
      label: SDK and language
      description: Which SDK and language are you defining capabilities from?
      placeholder: Go SDK, go1.24
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, container or host, and anything else that affects reproduction.
      placeholder: ubuntu 24.04, docker 27
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a clean state.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code or configuration
      description: The smallest example that shows the problem. Trim it until it still fails.
      render: shell
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Trimmed to the relevant lines. Remove secrets and credentials first.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and discussions for this problem.
          required: true
        - label: I removed secrets, tokens, and credentials from anything I pasted above.
          required: false
